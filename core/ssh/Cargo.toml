[package]
name = "ssh"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
# ring, not aws-lc-rs: ring cross-compiles to iOS with Xcode's clang alone;
# aws-lc-rs needs cmake and a C/ASM toolchain per target.
russh = { version = "0.64", default-features = false, features = ["ring", "flate2", "rsa"] }
# Direct dependency only to switch on key generation (ed25519, ecdsa, rsa).
ssh-key = { version = "=0.7.0-rc.11", default-features = false, features = ["std", "ed25519", "p256", "p384", "p521", "rsa", "rand_core", "getrandom"] }
tokio = { version = "1", features = ["net", "sync", "time"] }
bytes = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
tempfile = "3"
