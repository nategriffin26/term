<svg xmlns="http://www.w3.org/2000/svg" width="640" height="520" viewBox="0 0 640 520" role="img" aria-label="Connecting: SSH starts mosh-server, then the session runs over encrypted UDP and roams"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#5c667e" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#2855ef" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="520" rx="14" fill="#f5f7fb"/><text x="110" y="44" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0d1222" text-anchor="middle">Term</text><text x="530" y="44" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#0d1222" text-anchor="middle">Host</text><path d="M110 60V500" fill="none" stroke="#d3d9e6" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M530 60V500" fill="none" stroke="#d3d9e6" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><path d="M116 104H524" fill="none" stroke="#5c667e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="320" y="92" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#3c465c" text-anchor="middle">SSH, key auth</text><text x="320" y="128" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c667e" text-anchor="middle">TCP 22 · host key pinned on first use</text><path d="M116 184H524" fill="none" stroke="#5c667e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="320" y="172" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#3c465c" text-anchor="middle">mosh-server new … -- herdr terminal attach &lt;id&gt;</text><text x="320" y="208" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c667e" text-anchor="middle">idle timeout: 2 minutes in herdr, 7 days without</text><path d="M524 264H116" fill="none" stroke="#5c667e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="320" y="252" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#3c465c" text-anchor="middle">MOSH CONNECT 60001 &lt;key&gt;</text><text x="320" y="288" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c667e" text-anchor="middle">mosh-server detaches and keeps running</text><rect x="128" y="306" width="384" height="92" rx="10" fill="#e9eefc" stroke="#2855ef" stroke-width="1"/><path d="M144 340H496" fill="none" stroke="#2855ef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-accent)"/><path d="M496 364H144" fill="none" stroke="#2855ef" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-accent)"/><text x="320" y="330" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="400" fill="#2855ef" text-anchor="middle">UDP · AES-128-OCB</text><text x="320" y="388" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3c465c" text-anchor="middle">keystrokes out, screen diffs back</text><circle cx="110" cy="438" r="4" fill="#2855ef"/><text x="124" y="433" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5c667e" text-anchor="start">Wi-Fi → cell</text><path d="M116 448H524" fill="none" stroke="#5c667e" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="320" y="472" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#3c465c" text-anchor="middle">next packet re-homes the server</text></svg>
