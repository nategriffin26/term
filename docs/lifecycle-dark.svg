<svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480" role="img" aria-label="Surviving iOS: suspend, save and restore after a kill; reconnect in place when the server is gone"><defs><marker id="a-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#7c85a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="a-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#6f8cff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="640" height="480" rx="14" fill="#0a0d13"/><rect x="230" y="24" width="180" height="64" rx="12" fill="#141b2e" stroke="#6f8cff" stroke-width="1"/><text x="320" y="52" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#6f8cff" text-anchor="middle">Live</text><text x="320" y="74" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#7c85a1" text-anchor="middle">herdr over mosh</text><rect x="40" y="156" width="260" height="84" rx="10" fill="#121722" stroke="#232a3b" stroke-width="1"/><text x="58" y="184" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6eaf3" text-anchor="start">Suspend</text><text x="58" y="208" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a2abbf" text-anchor="start">network off</text><text x="58" y="228" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a2abbf" text-anchor="start">checkpoint saved</text><rect x="40" y="262" width="260" height="72" rx="10" fill="#121722" stroke="#232a3b" stroke-width="1"/><text x="58" y="290" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6eaf3" text-anchor="start">Killed</text><text x="58" y="314" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a2abbf" text-anchor="start">mosh-server keeps running</text><rect x="40" y="368" width="260" height="84" rx="10" fill="#121722" stroke="#232a3b" stroke-width="1"/><text x="58" y="396" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6eaf3" text-anchor="start">Restore</text><text x="58" y="420" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a2abbf" text-anchor="start">checkpoint read, then deleted</text><text x="58" y="440" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a2abbf" text-anchor="start">new socket, sends at once</text><rect x="340" y="156" width="260" height="72" rx="10" fill="#121722" stroke="#232a3b" stroke-width="1"/><text x="358" y="184" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6eaf3" text-anchor="start">Silent 6 s</text><text x="358" y="208" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a2abbf" text-anchor="start">probe the host over SSH</text><rect x="340" y="262" width="260" height="72" rx="10" fill="#121722" stroke="#232a3b" stroke-width="1"/><text x="358" y="290" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6eaf3" text-anchor="start">Reconnect in place</text><text x="358" y="314" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a2abbf" text-anchor="start">new mosh-server, same screen</text><rect x="340" y="368" width="260" height="72" rx="10" fill="#121722" stroke="#232a3b" stroke-width="1"/><text x="358" y="396" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#e6eaf3" text-anchor="start">Old server ended</text><text x="358" y="420" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a2abbf" text-anchor="start">same herdr pane</text><path d="M170 240V258" fill="none" stroke="#7c85a1" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M170 334V364" fill="none" stroke="#7c85a1" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M470 228V258" fill="none" stroke="#7c85a1" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M470 334V364" fill="none" stroke="#7c85a1" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><text x="182" y="354" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#7c85a1" text-anchor="start">relaunch</text><text x="482" y="252" font-family="'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="400" fill="#7c85a1" text-anchor="start">host answers</text><path d="M230 48H170V152" fill="none" stroke="#7c85a1" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#a-muted)"/><path d="M410 48H470V152" fill="none" str