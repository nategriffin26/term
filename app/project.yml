name: Term
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "27.0"
    SUPPORTS_MACCATALYST: NO
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
    HEADER_SEARCH_PATHS: $(SRCROOT)/../core/termcore/include
    SWIFT_OBJC_BRIDGING_HEADER: Sources/App/Term-Bridging-Header.h
packages:
  Runestone:
    url: https://github.com/simonbs/Runestone
    exactVersion: 0.5.2
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    exactVersion: 0.1.10
  cmark-gfm:
    url: https://github.com/swiftlang/swift-cmark
    exactVersion: 0.9.0
targets:
  Term:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - Themes
          - Diagrams
      - path: Resources/Themes
        type: folder
      # Pele 1.10.0 (pinned: term-pele.js reads its private CSS variables) and its glue.
      - path: Resources/Diagrams
        type: folder
      # The Screen's wire contract, shared verbatim with Term Screen Host on the Mac.
      - path: ../mac/ScreenHost/Sources/ScreenProtocol
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Term
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIViewControllerBasedStatusBarAppearance: true
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Terminal
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        NSUserActivityTypes:
          - $(PRODUCT_BUNDLE_IDENTIFIER).window
        NSLocalNetworkUsageDescription: Term connects to your computers on this network over SSH and mosh, so you can use their terminals and files from your phone.
        NSCameraUsageDescription: Term uploads photos and videos you take to your computer.
        NSMicrophoneUsageDescription: When you dictate, Term sends your voice to OpenRouter with your own key and types the text into the terminal. Videos you take also record sound.
        NSPhotoLibraryAddUsageDescription: Term saves diagrams you share to your photo library.
        NSFaceIDUsageDescription: Term confirms it's you before typing your saved Mac password.
        # Export compliance: SSH and mosh use only standard, published cryptography, built from this
        # public MIT source, so no export documentation is needed (EAR 734.3(b)(3), 742.15(b)).
        # France still needs a declaration: leave it out of the storefronts until one is filed.
        ITSAppUsesNonExemptEncryption: false
        # term://attach?host=<alias>&session=<tmux session> (DeepLink.swift); Dross opens its workers with it.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - term
        # The push relay (Config/Signing.xcconfig, RelayClient.swift); empty when the build sets none.
        TermRelayURL: $(TERM_RELAY_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TERM_BUNDLE_ID)
        PRODUCT_NAME: Term
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Settings › Appearance › App › App Icon; drawn by scripts/app-icons.swift.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-Porcelain AppIcon-Graphite
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        OTHER_LDFLAGS: [-lc++]
        # Push: always in the simulator; on devices once the App ID has Push (Config/Signing.xcconfig).
        CODE_SIGN_ENTITLEMENTS: $(TERM_DEVICE_ENTITLEMENTS)
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Config/Term.entitlements
      configs:
        Debug:
          TERM_APS_ENVIRONMENT: development
        Release:
          TERM_APS_ENVIRONMENT: production
    # The diagnostic log's launch line names the build: commit (+ -dirty) and time.
    postBuildScripts:
      - name: Record Build Commit
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          commit=$(git -C "$SRCROOT" rev-parse --short HEAD 2>/dev/null || echo unknown)
          if [ -n "$(git -C "$SRCROOT" status --porcelain 2>/dev/null)" ]; then commit="$commit-dirty"; fi
          plutil -replace TermBuildCommit -string "$commit" "$plist"
          plutil -replace TermBuildTime -string "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$plist"
    dependencies:
      - framework: ../build/TermCore.xcframework
        embed: false
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: CoreText.framework
      - sdk: GameController.framework
      - package: Runestone
      - package: TreeSitterLanguages
        products:
          - TreeSitterBashRunestone
          - TreeSitterCRunestone
          - TreeSitterCPPRunestone
          - TreeSitterCSSRunestone
          - TreeSitterGoRunestone
          - TreeSitterHTMLRunestone
          - TreeSitterJavaRunestone
          - TreeSitterJavaScriptRunestone
          - TreeSitterJSONRunestone
          - TreeSitterLuaRunestone
          - TreeSitterMarkdownRunestone
          - TreeSitterMarkdownInlineRunestone
          - TreeSitterPythonRunestone
          - TreeSitterRubyRunestone
          - TreeSitterRustRunestone
          - TreeSitterSCSSRunestone
          - TreeSitterSQLRunestone
          - TreeSitterSwiftRunestone
          - TreeSitterTOMLRunestone
          - TreeSitterTSXRunestone
          - TreeSitterTypeScriptRunestone
          - TreeSitterYAMLRunestone
      - package: cmark-gfm
        products:
          - cmark-gfm
          - cmark-gfm-extensions
  TermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Term
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(TERM_BUNDLE_ID).tests
schemes:
  Term:
    build:
      targets:
        Term: all
        TermTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TermTests
